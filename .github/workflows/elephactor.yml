name: Elephactor CI and dist mirrors

env:
  BOX_VERSION: "4.7.0"

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'tim-lappe/elephactor-dev' &&
      github.event_name == 'push'
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: bump
        env:
          ELEPHACTOR_DIST_TOKEN: ${{ secrets.ELEPHACTOR_DIST_TOKEN }}
        run: bash scripts/next-dist-release-version.sh

  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elephactor
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - run: composer install --no-interaction --prefer-dist
      - run: composer test

      - name: Verify PHAR build
        run: |
          set -euo pipefail
          curl -sSL -o box.phar "https://github.com/box-project/box/releases/download/${BOX_VERSION}/box.phar"
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          php -d phar.readonly=0 box.phar compile
          ./elephactor.phar --version

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elephactor-vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: elephactor-vscode/package-lock.json

      - name: Align extension version with elephactor/composer.json
        working-directory: ${{ github.workspace }}
        run: bash scripts/sync-elephactor-vscode-version.sh

      - run: npm ci

      - run: npm run check

      - name: Verify VSIX build
        run: npm run package -- --out elephactor-vscode.vsix

  sync:
    needs:
      - php
      - vscode
      - resolve-version
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'tim-lappe/elephactor-dev' &&
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Apply release version to Composer manifests
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_VERSION}" ]]; then
            echo "resolve-version did not produce a version output."
            exit 1
          fi
          bash scripts/apply-elephactor-release-version.sh "${RELEASE_VERSION}"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Build PHAR
        working-directory: elephactor
        run: |
          set -euo pipefail
          curl -sSL -o box.phar "https://github.com/box-project/box/releases/download/${BOX_VERSION}/box.phar"
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          php -d phar.readonly=0 box.phar compile
          ./elephactor.phar --version

      - name: Clone dist repository
        env:
          ELEPHACTOR_DIST_TOKEN: ${{ secrets.ELEPHACTOR_DIST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ELEPHACTOR_DIST_TOKEN:-}" ]; then
            echo "ELEPHACTOR_DIST_TOKEN is not set. Add a repository secret with push access to tim-lappe/elephactor."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${ELEPHACTOR_DIST_TOKEN}@github.com/tim-lappe/elephactor.git" dist-repo

      - name: Publish Composer package (PHAR + bin + composer.json) to dist repo
        run: |
          set -euo pipefail
          find dist-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          mkdir -p dist-repo/bin
          install -m0644 elephactor/LICENSE dist-repo/LICENSE
          install -m0644 elephactor/composer.dist.json dist-repo/composer.json
          install -m0755 elephactor/elephactor.phar dist-repo/elephactor.phar
          install -m0755 elephactor/bin/elephactor dist-repo/bin/elephactor

      - name: Commit and push
        env:
          ELEPHACTOR_DIST_TOKEN: ${{ secrets.ELEPHACTOR_DIST_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${VERSION}" ]]; then
            echo "Missing release version."
            exit 1
          fi
          DIST_REMOTE="https://x-access-token:${ELEPHACTOR_DIST_TOKEN}@github.com/tim-lappe/elephactor.git"
          cd dist-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "Publish elephactor.phar v${VERSION} from tim-lappe/elephactor-dev@${GITHUB_SHA}"
          git push "${DIST_REMOTE}" HEAD:main
          if git ls-remote --tags "${DIST_REMOTE}" "refs/tags/v${VERSION}" | grep -q .; then
            echo "Tag v${VERSION} already exists on dist remote."
          else
            git tag -a "v${VERSION}" -m "Release v${VERSION} (source tim-lappe/elephactor-dev@${GITHUB_SHA})"
            git push "${DIST_REMOTE}" "refs/tags/v${VERSION}"
          fi

  sync-vscode:
    needs:
      - php
      - vscode
      - resolve-version
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'tim-lappe/elephactor-dev' &&
      github.event_name == 'push'
    defaults:
      run:
        working-directory: elephactor-vscode
    steps:
      - uses: actions/checkout@v4

      - name: Apply release version to Composer manifests
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_VERSION}" ]]; then
            echo "resolve-version did not produce a version output."
            exit 1
          fi
          bash scripts/apply-elephactor-release-version.sh "${RELEASE_VERSION}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: elephactor-vscode/package-lock.json

      - name: Align extension version with elephactor/composer.json
        working-directory: ${{ github.workspace }}
        run: bash scripts/sync-elephactor-vscode-version.sh

      - run: npm ci

      - name: Build VSIX
        run: |
          set -euo pipefail
          npm run package -- --out elephactor-vscode.vsix
          test -f elephactor-vscode.vsix

      - name: Clone VS Code dist repository
        env:
          ELEPHACTOR_DIST_TOKEN: ${{ secrets.ELEPHACTOR_DIST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ELEPHACTOR_DIST_TOKEN:-}" ]; then
            echo "ELEPHACTOR_DIST_TOKEN is not set. Add a repository secret with push access to tim-lappe/elephactor-vscode."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${ELEPHACTOR_DIST_TOKEN}@github.com/tim-lappe/elephactor-vscode.git" ../vscode-dist-repo

      - name: Publish VS Code extension build to dist repo
        run: |
          set -euo pipefail
          find ../vscode-dist-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          mkdir -p ../vscode-dist-repo/dist
          rsync -a --exclude 'test/' dist/ ../vscode-dist-repo/dist/
          install -m0644 LICENSE ../vscode-dist-repo/LICENSE
          install -m0644 package.json ../vscode-dist-repo/package.json
          install -m0644 README.dist.md ../vscode-dist-repo/README.md
          install -m0644 elephactor-vscode.vsix ../vscode-dist-repo/elephactor-vscode.vsix

      - name: Commit and push VS Code dist
        env:
          ELEPHACTOR_DIST_TOKEN: ${{ secrets.ELEPHACTOR_DIST_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${VERSION}" ]]; then
            echo "Missing release version."
            exit 1
          fi
          VSCODE_DIST_REMOTE="https://x-access-token:${ELEPHACTOR_DIST_TOKEN}@github.com/tim-lappe/elephactor-vscode.git"
          cd ../vscode-dist-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "Publish elephactor-vscode v${VERSION} from tim-lappe/elephactor-dev@${GITHUB_SHA}"
          git push "${VSCODE_DIST_REMOTE}" HEAD:main
          if git ls-remote --tags "${VSCODE_DIST_REMOTE}" "refs/tags/v${VERSION}" | grep -q .; then
            echo "Tag v${VERSION} already exists on dist remote."
          else
            git tag -a "v${VERSION}" -m "Release v${VERSION} (source tim-lappe/elephactor-dev@${GITHUB_SHA})"
            git push "${VSCODE_DIST_REMOTE}" "refs/tags/v${VERSION}"
          fi
